name: 2. AI Szintézis (1 hour)

on:
  repository_dispatch:
    types: [ai-synthesis-trigger]
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kód letöltése a repóból
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: AI Szintézis script futtatása
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python cikk_szintetizalas.py

      - name: AI Szintetizált adatok mentése és Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git fetch origin main
          git add src/data/news.json erdelyi_hirek_memoria.json
          git diff --staged --quiet || git commit -m "update: AI szintézis frissítve [skip ci]"
          
          # Ha ütközik a 10 perces scraperrel, az AI által generált friss tartalom nyer
          git rebase origin/main -X ours || (git rebase --skip && git add . && git commit -m "update: AI szintézis frissítve [skip ci]")
          
          git push origin main
