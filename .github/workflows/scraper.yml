name: Hírgyűjtő és AI Szintetizáló

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Írási jog megadása a commitoláshoz

    steps:
      - name: Kód letöltése a repóból
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Scraper script futtatása
        run: |
          python weboldalparolas.py

      - name: AI Szintézis script futtatása
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python cikk_szintetizalas.py

      - name: Változások elmentése a GitHubra
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Elmentjük a munkafájlokat és a végső news.json-t is
          git add erdelyi_hirek_memoria.json erdelyi_hirek_csoportositott.json src/data/news.json
          git commit -m "Auto-update: Friss adatok és szintetizált hírek [skip ci]" || exit 0
          git push
