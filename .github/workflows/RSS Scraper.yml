name: 1. RSS Scraper (10 min)

on:
  repository_dispatch:
    types: [rss-scraper-trigger]
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Scraper futtatása
        run: python weboldalparolas.py

      - name: Memória elmentése
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 1. Először stagingre rakjuk a frissített fájlokat
          git add erdelyi_hirek_memoria.json erdelyi_hirek_csoportositott.json
          
          # 2. Előkészítjük a helyi commitot (ha van változás)
          git diff --staged --quiet || git commit -m "update: RSS adatok frissítése [skip ci]"
          
          # 3. Behúzzuk a távoli tároló frissítéseit a tiszta munkamenetre
          git fetch origin main
          git pull --rebase origin main
          
          # 4. Feltoljuk a frissített állapotot
          git push origin main
