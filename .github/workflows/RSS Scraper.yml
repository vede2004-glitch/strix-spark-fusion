name: 1. RSS Scraper (10 min)

on:
  repository_dispatch:
    types: [rss-scraper-trigger]
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Scraper futtatása
        run: python weboldalparolas.py

      - name: Memória elmentése és Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 1. Először behúzzuk a legfrissebb távoli állapotot
          git fetch origin main
          
          # 2. Hozzáadjuk a frissen generált JSON fájlokat
          git add erdelyi_hirek_memoria.json erdelyi_hirek_csoportositott.json erdelyi_hirek_archivum.json src/data/news.json
          
          # 3. Elkészítjük a commitot
          git diff --staged --quiet || git commit -m "update: RSS adatok frissítése [skip ci]"
          
          # 4. Konfliktusmentes rebase: Ha ütközés van a JSON-ben, a most kigenerált friss állapot nyer (-X ours)
          git rebase origin/main -X ours || (git rebase --skip && git add . && git commit -m "update: RSS adatok frissítése [skip ci]")
          
          # 5. Push a távoli tárolóba
          git push origin main
