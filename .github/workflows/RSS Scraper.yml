name: 1. RSS Scraper (10 min)

on:
  repository_dispatch:
    types: [rss-scraper-trigger]
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Scraper futtatása
        run: python weboldalparolas.py

      - name: Memória elmentése és Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 1. Hozzáadjuk a frissen generált JSON fájlokat a stagerhez
          git add erdelyi_hirek_memoria.json erdelyi_hirek_csoportositott.json erdelyi_hirek_archivum.json src/data/news.json
          
          # 2. Ellenőrizzük, hogy van-e érdemi eltérés
          if git diff --staged --quiet; then
            echo "ℹ️ Nincs új hír vagy változás a fájlokban, commit és push kihagyva."
          else
            echo "✨ Új hírek találhatók! Frissítés mentése..."
            
            # Behúzzuk a legfrissebb távoli állapotot
            git fetch origin main
            
            # Commit elkészítése
            git commit -m "update: RSS adatok frissítése [skip ci]"
            
            # Konfliktusmentes rebase
            git rebase origin/main -X ours || (git rebase --skip && git add . && git commit -m "update: RSS adatok frissítése [skip ci]")
            
            # Push a távoli tárolóba
            git push origin main
          fi
